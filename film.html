<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dizi Film</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
        }
        
        .nav-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .nav-btn:hover {
            background-color: #555;
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        /* Bulunulan sayfayı belli etmek için aktif buton stili */
        .aktif-btn {
            background-color: #007bff;
            font-weight: bold;
        }

        .aktif-btn:hover {
            background-color: #0056b3;
        }

        .galeri {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .galeri img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .galeri img:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Yönlendirme Butonları -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="window.location.href='index.html'">Ana Sayfa</button>
        <button class="nav-btn aktif-btn" onclick="window.location.href='dizifilm.html'">Dizi Film</button>
        <button class="nav-btn" onclick="window.location.href='oyunlar.html'">Oyunlar</button>
        <button class="nav-btn" onclick="window.location.href='muzik.html'">Müzik</button>
        <button class="nav-btn" onclick="window.location.href='kitaplar.html'">Kitaplar</button>
    </div>

    <h1>Dizi Film</h1>

    <!-- 4 Adet Fotoğraf (Tıklandığında yeni sekmede açılır) -->
    <div class="galeri">
        <a href="hotd.jpg" target="_blank">
            <img src="hotd.jpg" alt="House of the Dragon">
        </a>
        <a href="interstellar.jpg" target="_blank">
            <img src="interstellar.jpg" alt="Interstellar">
        </a>
        <a href="hobbit.jpg" target="_blank">
            <img src="hobbit.jpg" alt="The Hobbit">
        </a>
        <a href="breba.jpg" target="_blank">
            <img src="breba.jpg" alt="Breaking Bad">
        </a>
    </div>

</body>
</html>
