<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Sayfa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
        }
        
        .geri-btn {
            padding: 10px 20px;
            margin-bottom: 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
            transition: background 0.2s ease;
        }

        .geri-btn:hover {
            background-color: #555;
        }

        .galeri {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .galeri img {
            width: 100%;
            aspect-ratio: 2 / 3; /* Standart dikey afiş oranı */
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .galeri img:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 15px rgba(255, 255, 255, 0.2);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); 
            justify-content: center;
            align-items: center;
        }
        
        .modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        
        .kapat-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white; 
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="geri-btn" onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>

    <h1>Dizi Film</h1>

    <!-- 4 Adet Fotoğraf -->
    <div class="galeri">
        <img src="hotd.jpg" onclick="fotografBuyut(this.src)" alt="House of the Dragon">
        <img src="interstellar.jpg" onclick="fotografBuyut(this.src)" alt="Interstellar">
        <img src="hobbit.jpg" onclick="fotografBuyut(this.src)" alt="The Hobbit">
        <img src="breba.jpg" onclick="fotografBuyut(this.src)" alt="Breaking Bad">
    </div>

    <div id="resimModali" class="modal" onclick="modalKapat()">
        <span class="kapat-btn">&times;</span>
        <img id="buyuyenResim" src="" alt="Büyütülen Görsel">
    </div>

    <script>
        function fotografBuyut(resimKaynagi) {
            var modal = document.getElementById("resimModali");
            var buyuyenResim = document.getElementById("buyuyenResim");
            buyuyenResim.src = resimKaynagi;
            modal.style.display = "flex";
        }

        function modalKapat() {
            var modal = document.getElementById("resimModali");
            modal.style.display = "none";
        }
    </script>
</body>
</html>
