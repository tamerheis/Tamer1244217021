<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Efsaneleri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
        }
        
        .nav-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .nav-btn:hover {
            background-color: #555;
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

        /* Bulunulan sayfayı belli etmek için aktif buton stili */
        .aktif-btn {
            background-color: #007bff;
            font-weight: bold;
        }

        .aktif-btn:hover {
            background-color: #0056b3;
        }

        .galeri {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Fotoğraf boyutları orijinal halindeki gibi bırakıldı */
        .galeri img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .galeri img:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Yönlendirme Butonları -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="window.location.href='index.html'">Ana Sayfa</button>
        <button class="nav-btn" onclick="window.location.href='film.html'">Dizi Film</button>
        <button class="nav-btn" onclick="window.location.href='hobi.html'">Hobi</button>
        <button class="nav-btn aktif-btn" onclick="window.location.href='rock-efsaneleri.html'">Rock Efsaneleri</button>
        <button class="nav-btn" onclick="window.location.href='kitap.html'">Kitap</button>
    </div>

    <h1>Rock Efsaneleri</h1>

    <!-- 4 Adet Fotoğraf (Tıklandığında yeni sekmede açılır) -->
    <div class="galeri">
        <a href="barisakarsu.jpg" target="_blank">
            <img src="barisakarsu.jpg" alt="Barış Akarsu">
        </a>
        <a href="barismanco.jpg" target="_blank">
            <img src="barismanco.jpg" alt="Barış Manço">
        </a>
        <a href="cemkaraca.jpg" target="_blank">
            <img src="cemkaraca.jpg" alt="Cem Karaca">
        </a>
        <a href="chester.jpg" target="_blank">
            <img src="chester.jpg" alt="Chester Bennington">
        </a>
    </div>

</body>
</html>
