    <title>Rock Efsaneleri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
        }
        
        .nav-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .nav-btn:hover {
            background-color: #555;
        }

        .nav-btn:active {
            transform: scale(0.98);
        }

       
        .aktif-btn {
            background-color: #007bff;
            font-weight: bold;
        }

        .aktif-btn:hover {
            background-color: #0056b3;
        }

        .galeri {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
      
        .galeri img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .galeri img:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

        </a>
    </div>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Sayfa</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .geri-btn {
            padding: 10px 20px;
            margin-bottom: 20px;
            font-size: 16px;
            cursor: pointer;
        }

       
        .galeri {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .galeri img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }

       
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        
        .modal img {
            max-width: 90%;
            max-height: 90%;
        }
        
      
        .kapat-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>


    <button class="geri-btn" onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>

   
    <h1>Rock Efsaneleri</h1>

   
    <div class="galeri">
        <img src="barisakarsu.jpg" onclick="fotografBuyut(this.src)">
        <img src="barismanco.jpg" onclick="fotografBuyut(this.src)">
        <img src="cemkaraca.jpg" onclick="fotografBuyut(this.src)">
        <img src="chester.jpg" onclick="fotografBuyut(this.src)">
    </div>

 
    <div id="resimModali" class="modal" onclick="modalKapat()">
        <span class="kapat-btn">&times;</span>
        <img id="buyuyenResim" src="">
    </div>

 
    <script>
        function fotografBuyut(resimKaynagi) {
            var modal = document.getElementById("resimModali");
            var buyuyenResim = document.getElementById("buyuyenResim");
            buyuyenResim.src = resimKaynagi;
            modal.style.display = "flex";
        }

        function modalKapat() {
            var modal = document.getElementById("resimModali");
            modal.style.display = "none";
        }
    </script>
</body>
</html>
